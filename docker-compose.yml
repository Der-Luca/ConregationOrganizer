services:
  co_db:
    image: postgres:16
    container_name: co_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Berlin
    volumes:
      - co_db_data:/var/lib/postgresql/data

  co_server:
    build:
      context: ./server
    container_name: co_server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@co_db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME}
    volumes:
      - co_uploads:/app/uploads
    depends_on:
      - co_db

  co_client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    container_name: co_client
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      - co_server

volumes:
  co_db_data:
  co_uploads:
